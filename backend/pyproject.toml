[project]
name = "educationos-backend"
version = "0.6.0"
description = "Python application and safety boundary for EducationOS"
requires-python = ">=3.13,<3.15"
dependencies = [
  "fastapi==0.143.3",
  "uvicorn==0.54.0",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.0",
  "sqlalchemy[asyncio]==2.1.5",
  "alembic==1.20.0",
  "psycopg[binary]==3.3.6",
  "redis==8.1.0",
  "pgvector==0.5.1",
  "mcp==2.3.0",
  "opentelemetry-api==1.45.1",
  "opentelemetry-sdk==1.45.1",
  "opentelemetry-instrumentation-fastapi==0.66b1",
  "opentelemetry-exporter-otlp-proto-http==1.45.1",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "httpx==0.28.1",
  "aiosqlite==0.22.1",
  "ruff==0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/educationos"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]
