name: EducationOS checks

on:
  push:
    branches: [main, master, 'codex/**', 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: TypeScript, PostgreSQL and browser behavior
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: educationos_ci
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: educationos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U educationos_ci -d educationos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      AUTH_MODE: disabled
      APP_ORIGIN: http://127.0.0.1:3000
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      DATABASE_URL: postgresql://educationos_ci:synthetic-ci-only@localhost:5432/educationos_test?sslmode=disable
      DIRECT_URL: postgresql://educationos_ci:synthetic-ci-only@localhost:5432/educationos_test?sslmode=disable
      TEST_DATABASE_URL: postgresql://educationos_ci:synthetic-ci-only@localhost:5432/educationos_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate and generate database client
        run: |
          npx prisma validate
          npx prisma generate
      - name: Apply committed migration to clean PostgreSQL
        run: |
          npx prisma migrate deploy
          npx prisma migrate status
      - name: Verify synthetic curriculum seed is idempotent
        run: |
          npm run db:seed
          npm run db:seed
      - name: Frontend icon policy, lint, types, tests and production build
        run: npm run check
      - name: Install Chromium and operating system dependencies
        run: npx playwright install --with-deps chromium
      - name: Browser flows and accessibility
        run: npm run test:e2e
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  container:
    name: Portable container build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build standalone runtime
        run: docker build --tag educationos:ci .
