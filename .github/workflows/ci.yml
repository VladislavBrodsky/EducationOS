name: EducationOS Python-first checks
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    name: Python safety, PostgreSQL RLS and migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg18-bookworm@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env:
          POSTGRES_USER: educationos
          POSTGRES_PASSWORD: educationos-local-only
          POSTGRES_DB: educationos_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U educationos -d educationos_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
      redis:
        image: redis:8-bookworm@sha256:47670742d7924adbcdb404d1288b6327815b23141969c0939b8e5d61f78c2634
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      EDUCATIONOS_ENVIRONMENT: test
      EDUCATIONOS_DATABASE_URL: postgresql+psycopg://educationos:educationos-local-only@localhost:5432/educationos_test
      EDUCATIONOS_TEST_DATABASE_URL: postgresql+psycopg://educationos:educationos-local-only@localhost:5432/educationos_test
      EDUCATIONOS_TEST_APP_DATABASE_URL: postgresql+psycopg://educationos_app:educationos-app-local-only@localhost:5432/educationos_test
      EDUCATIONOS_TEST_WORKER_DATABASE_URL: postgresql+psycopg://educationos_worker:educationos-worker-local-only@localhost:5432/educationos_test
      EDUCATIONOS_REDIS_URL: redis://localhost:6379/0
      EDUCATIONOS_TEST_REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python -m pip install uv==0.10.11
      - run: uv sync --frozen
        working-directory: backend
      - name: Create restricted local test roles
        working-directory: backend
        run: |
          uv run --frozen python - <<'PYTHON'
          import psycopg
          from pathlib import Path
          with psycopg.connect('postgresql://educationos:educationos-local-only@localhost:5432/educationos_test', autocommit=True) as connection:
              connection.execute(Path('../infra/init-runtime-role.sql').read_text().replace('DATABASE educationos TO', 'DATABASE educationos_test TO'))
          PYTHON
      - run: uv run --frozen ruff check .
        working-directory: backend
      - run: uv run --frozen pytest -v
        working-directory: backend
      - name: OpenAPI source drift
        run: |
          cd backend
          uv run --frozen python -m educationos.export_openapi
          cd ..
          git diff --exit-code -- backend/openapi.json
  frontend:
    name: Browser types, behavior and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      PYTHON_API_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm}
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
  compose:
    name: Full Python stack smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up --build --wait api web
      - name: Live public API, web proxy, closed gates and worker
        run: |
          curl --fail http://127.0.0.1:8000/health/ready
          curl --fail 'http://127.0.0.1:3000/api/v1/missions?age_band=10-12'
          curl --fail http://127.0.0.1:3000/demo
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8000/api/v1/auth/register)" = 503
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8000/api/v1/ai/respond)" = 503
          docker compose run --rm worker python -m educationos.worker --once
      - name: Diagnostics
        if: failure()
        run: docker compose logs --no-color --tail=100
      - name: Stop disposable stack
        if: always()
        run: docker compose down
