name: EducationOS presentation checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  presentation:
    name: Presentation and superseded-reference regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Presentation build and labeled reference tests
        run: npm run check
      - run: npx playwright install --with-deps chromium
      - name: Synthetic browser journeys and accessibility scans
        run: npm run test:e2e
      - name: Preserve browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
